  <style>
    html, body { margin: 0; background: #FFFBFA; }
    #skeleton {
      position: fixed; inset: 0; z-index: 9999; background: #FFFBFA;
      font-family: sans-serif; transition: opacity .6s ease;
      background-image: radial-gradient(circle at 75% 30%, rgba(232,196,196,.30) 0, rgba(232,196,196,0) 35%);
    }
    #skeleton.hide { opacity: 0; pointer-events: none; }
    .sk { background: linear-gradient(90deg,#F9F0EF 25%,#FFFAF9 50%,#F9F0EF 75%);
          background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .sk-nav { height: 76px; border-bottom: 1px solid #F0DEDD; display: flex;
              align-items: center; justify-content: space-between; padding: 0 6vw; }
    .sk-hero { display: flex; align-items: center; justify-content: space-between;
               gap: 40px; padding: 100px 6vw; max-width: 1140px; margin: auto; }
    .sk-text { flex: 1; }
    .sk-arch { width: 300px; height: 380px; border-radius: 150px 150px 20px 20px; flex-shrink: 0;
               outline: 1px solid rgba(122,46,59,.15); outline-offset: 14px; }
    .sk-gold { background: linear-gradient(90deg,#F2DFE0 25%,#FBF0F0 50%,#F2DFE0 75%); background-size: 200% 100%;
               animation: shimmer 1.5s infinite; }
    @media (max-width: 820px) {
      .sk-hero { flex-direction: column-reverse; padding: 50px 22px; }
      .sk-arch { width: 220px; height: 280px; }
      .sk-links { display: none; }
    }
  </style>
</head>
<body>
  <div id="skeleton">
    <div class="sk-nav">
      <div class="sk" style="width:120px;height:40px;border-radius:30px"></div>
      <div class="sk-links" style="display:flex;gap:22px;align-items:center">
        <div class="sk" style="width:56px;height:12px"></div>
        <div class="sk" style="width:56px;height:12px"></div>
        <div class="sk" style="width:56px;height:12px"></div>
        <div class="sk" style="width:56px;height:12px"></div>
        <div class="sk sk-gold" style="width:110px;height:40px;border-radius:30px"></div>
      </div>
    </div>
    <div class="sk-hero">
      <div class="sk-text">
        <div class="sk" style="width:230px;height:34px;border-radius:30px"></div>
        <div class="sk" style="width:120px;height:16px;margin-top:34px"></div>
        <div class="sk sk-gold" style="width:85%;max-width:520px;height:64px;margin-top:14px"></div>
        <div class="sk" style="width:60%;max-width:340px;height:30px;margin-top:18px"></div>
        <div class="sk" style="width:90%;max-width:500px;height:14px;margin-top:26px"></div>
        <div class="sk" style="width:70%;max-width:400px;height:14px;margin-top:10px"></div>
        <div style="display:flex;gap:16px;margin-top:38px">
          <div class="sk sk-gold" style="width:170px;height:54px;border-radius:40px"></div>
          <div class="sk" style="width:170px;height:54px;border-radius:40px"></div>
        </div>
      </div>
      <div class="sk sk-arch"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('skeleton');
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 700);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
